[project]
name = "lmux-anthropic"
version = "0.16.2"
description = "Anthropic provider for lmux"
requires-python = ">=3.13"
license = "MIT"
readme = "README.md"
authors = [{ name = "Connor Luebbehusen", email = "connor@luebbehusen.dev" }]
keywords = ["llm", "ai", "anthropic", "claude", "language-model"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "lmux~=0.12",
  "httpx~=0.28",
]

[project.optional-dependencies]
vertex = ["google-auth~=2.0"]
requests = ["google-auth[requests]~=2.0"]
bedrock = ["boto3>=1.42.31,<2", "lmux-bedrock-shared~=0.3"]

[project.urls]
Homepage = "https://github.com/cluebbehusen/lmux"
Source = "https://github.com/cluebbehusen/lmux/tree/main/packages/lmux-anthropic"
Issues = "https://github.com/cluebbehusen/lmux/issues"

[tool.uv.sources]
lmux = { workspace = true }
lmux-bedrock-shared = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"
